<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Forseti direction decisions</title>
  <desc id="desc">Development concept: an inserted user task may be temporary, exploratory, or an approved new north star. AI drift needs separate evidence.</desc>
  <rect width="1200" height="470" fill="#101214"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif">
    <text x="48" y="64" fill="#f7f8f7" font-size="30" font-weight="700">Direction changed. Who changed it?</text>
    <text x="48" y="101" fill="#a4adb1" font-size="18">Development concept: orange marks a question, not an automatic AI-drift verdict.</text>
    <path d="M48 189H320" stroke="#61d6a1" stroke-width="4"/>
    <circle cx="78" cy="189" r="10" fill="#61d6a1"/>
    <circle cx="174" cy="189" r="10" fill="#61d6a1"/>
    <circle cx="282" cy="189" r="10" fill="#f3b64a"/>
    <text x="48" y="148" fill="#c5d2d1" font-size="19">Original goal</text>
    <text x="238" y="148" fill="#f3b64a" font-size="19">New task</text>
    <path d="M320 189H460" stroke="#f3b64a" stroke-width="3" stroke-dasharray="8 7"/>
    <rect x="460" y="140" width="254" height="99" rx="8" fill="#24201a" stroke="#f3b64a"/>
    <text x="485" y="180" fill="#fff" font-size="20" font-weight="700">Candidate prompt</text>
    <text x="485" y="211" fill="#e5be7f" font-size="17">Temporary, explore, or replace?</text>
    <path d="M714 189H757M757 189V318M757 189V142" fill="none" stroke="#8a9296" stroke-width="2"/>
    <path d="M757 142H780M757 227H780M757 318H780" stroke="#8a9296" stroke-width="2"/>
    <rect x="780" y="112" width="369" height="61" rx="7" fill="#1e2223" stroke="#f3b64a"/>
    <circle cx="805" cy="142" r="7" fill="#f3b64a"/>
    <text x="824" y="149" fill="#f7f8f7" font-size="19">Temporary: keep original goal</text>
    <rect x="780" y="197" width="369" height="61" rx="7" fill="#1e2223" stroke="#f3b64a" stroke-dasharray="5 5"/>
    <circle cx="805" cy="227" r="7" fill="#f3b64a"/>
    <text x="824" y="234" fill="#f7f8f7" font-size="19">Explore: branch, don't replace</text>
    <rect x="780" y="288" width="369" height="61" rx="7" fill="#1e2223" stroke="#bd86ed"/>
    <circle cx="805" cy="318" r="7" fill="#bd86ed"/>
    <text x="824" y="325" fill="#f7f8f7" font-size="19">Approve: new goal version</text>
    <path d="M48 377H1136" stroke="#714947" stroke-width="2"/>
    <circle cx="75" cy="406" r="8" fill="#fa7074"/>
    <text x="97" y="413" fill="#e0a7a8" font-size="18">Check AI claims separately; goal drift currently reaches at most SUSPECTED.</text>
  </g>
</svg>

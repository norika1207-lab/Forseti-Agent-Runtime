[package]
name = "forseti-desktop"
version = "0.1.0"
edition = "2021"
description = "Forseti 桌面版"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# 【2026-09-18】直接對 WKWebView 設 allowsContentJavaScript。
# 三條獨立的 JS 注入路徑都不執行，而 HTML 渲染正常,
# 所以是 WKWebView 這一層把 JavaScript 關了。
# wry 只處理「要關」(javascript_disabled) 沒處理「要開」,
# 而 macOS 26 的預設可能已經不是 true。
# 版本跟著 wry 帶進來的那幾個走,不另外挑。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[profile.release]
opt-level = "s"
lto = true
strip = true

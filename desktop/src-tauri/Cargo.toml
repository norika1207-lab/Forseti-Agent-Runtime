[package]
name = "forseti-desktop"
version = "0.1.0"
edition = "2021"
description = "Forseti 桌面版"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[profile.release]
opt-level = "s"
lto = true
strip = true

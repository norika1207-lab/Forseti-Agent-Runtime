<title>Forseti Source Tree</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FAFAFB; --panel:#FFFFFF; --ink:#16191F; --ink2:#4A5160; --ink3:#858D9C;
  --rule:#E2E5EB; --rule2:#CDD2DB; --accent:#2C5F7C;
  --ok:#7C8B7E; --stalled:#C8791A; --watch:#3B6EA5; --corrected:#B33A2B;
  --ok-bg:#F1F4F1; --stalled-bg:#FDF3E4; --watch-bg:#EDF2F8; --corrected-bg:#FBEEEC;
  --sans:"IBM Plex Sans","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161A; --panel:#1B1E24; --ink:#E8EAEE; --ink2:#A9B0BC; --ink3:#727A88;
    --rule:#2A2E36; --rule2:#3A4049; --accent:#7FB2CE;
    --ok:#8FA391; --stalled:#E0A050; --watch:#6C9BCB; --corrected:#D4695A;
    --ok-bg:#1D231E; --stalled-bg:#2A2316; --watch-bg:#1A2230; --corrected-bg:#2B1D1B;
  }
}
:root[data-theme="dark"]{
  --bg:#14161A; --panel:#1B1E24; --ink:#E8EAEE; --ink2:#A9B0BC; --ink3:#727A88;
  --rule:#2A2E36; --rule2:#3A4049; --accent:#7FB2CE;
  --ok:#8FA391; --stalled:#E0A050; --watch:#6C9BCB; --corrected:#D4695A;
  --ok-bg:#1D231E; --stalled-bg:#2A2316; --watch-bg:#1A2230; --corrected-bg:#2B1D1B;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:28px 22px 60px}

header{border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:20px}
h1{font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em}
.sub{color:var(--ink2);font-size:13px;margin:0}
.sub code{font-family:var(--mono);font-size:12px;color:var(--ink3)}

.tally{display:flex;gap:0;margin:18px 0 6px;border:1px solid var(--rule);
  border-radius:3px;overflow:hidden;background:var(--panel)}
.tally div{flex:1;padding:11px 14px;border-right:1px solid var(--rule)}
.tally div:last-child{border-right:0}
.tally .num{font-family:var(--mono);font-size:21px;font-weight:500;
  font-variant-numeric:tabular-nums;line-height:1.1}
.tally .lbl{font-size:11px;color:var(--ink3);letter-spacing:.06em;
  text-transform:uppercase;margin-top:3px}
.tally .desc{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.4}
.c-OK{color:var(--ok)} .c-STALLED{color:var(--stalled)}
.c-WATCH{color:var(--watch)} .c-CORRECTED{color:var(--corrected)}

.mini{margin:16px 0 4px}
.mini-lbl{font-size:11px;color:var(--ink3);letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:6px}
.mini-bar{display:flex;gap:1px;height:30px;align-items:stretch;
  border:1px solid var(--rule);border-radius:2px;padding:3px;background:var(--panel);
  overflow-x:auto}
.mini-bar i{flex:1 0 3px;min-width:3px;border-radius:1px;cursor:pointer;
  transition:transform .12s}
.mini-bar i:hover{transform:scaleY(1.18)}
.mini-note{font-size:12px;color:var(--ink3);margin-top:7px}

.cols{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;
  margin-top:22px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}

.listwrap{border:1px solid var(--rule);border-radius:3px;background:var(--panel);
  max-height:660px;overflow-y:auto}
.filters{display:flex;gap:6px;padding:9px 11px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--panel);z-index:2;flex-wrap:wrap}
.filters button{font:inherit;font-size:12px;padding:3px 9px;border-radius:2px;
  border:1px solid var(--rule2);background:transparent;color:var(--ink2);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);
  border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

ol.line{list-style:none;margin:0;padding:6px 0}
ol.line li{position:relative;padding:0}
.node{width:100%;text-align:left;font:inherit;background:transparent;border:0;
  cursor:pointer;display:grid;grid-template-columns:34px 16px 1fr;gap:9px;
  align-items:start;padding:5px 12px 5px 8px;border-left:2px solid transparent}
.node:hover{background:var(--bg)}
.node[aria-current="true"]{border-left-color:var(--accent);background:var(--bg)}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.node .idx{font-family:var(--mono);font-size:11px;color:var(--ink3);
  font-variant-numeric:tabular-nums;padding-top:2px}
.rail{position:relative;height:100%;min-height:22px}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:-10px;width:1px;
  background:var(--rule2);transform:translateX(-50%)}
li:last-child .rail::before{bottom:50%}
.dot{position:absolute;left:50%;top:6px;width:9px;height:9px;border-radius:50%;
  transform:translateX(-50%);border:2px solid var(--panel)}
.node .txt{font-size:12.5px;color:var(--ink2);overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.node[data-lv="OK"] .txt{color:var(--ink3)}

.detail{border:1px solid var(--rule);border-radius:3px;background:var(--panel);
  padding:18px 20px;min-height:300px}
.d-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.d-round{font-family:var(--mono);font-size:15px;font-weight:500;
  font-variant-numeric:tabular-nums}
.badge{font-size:11px;letter-spacing:.05em;padding:2px 7px;border-radius:2px;
  font-weight:500}
.b-OK{background:var(--ok-bg);color:var(--ok)}
.b-STALLED{background:var(--stalled-bg);color:var(--stalled)}
.b-WATCH{background:var(--watch-bg);color:var(--watch)}
.b-CORRECTED{background:var(--corrected-bg);color:var(--corrected)}
.d-meta{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:auto}

.why{font-size:13px;color:var(--ink);background:var(--bg);border-left:2px solid var(--rule2);
  padding:9px 12px;margin:0 0 16px;border-radius:0 2px 2px 0}
.why.w-STALLED{border-left-color:var(--stalled)}
.why.w-CORRECTED{border-left-color:var(--corrected)}
.why.w-WATCH{border-left-color:var(--watch)}

.seg{margin-bottom:15px}
.seg h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 5px;font-weight:500}
.seg p{margin:0;font-size:13px;color:var(--ink2);white-space:pre-wrap;
  word-break:break-word}
.seg.owner p{color:var(--ink);font-weight:500}
.refs{margin:0;padding-left:16px;font-size:12.5px;color:var(--corrected)}
.refs li{margin-bottom:3px}

.fork{margin-top:16px;padding:12px 14px;border:1px dashed var(--rule2);
  border-radius:3px;background:var(--bg)}
.fork h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 6px;font-weight:500}
.fork p{margin:0;font-size:12.5px;color:var(--ink2)}
.fork code{font-family:var(--mono);font-size:12px;background:var(--panel);
  padding:1px 5px;border:1px solid var(--rule);border-radius:2px}
.fork .na{color:var(--ink3)}
.fork .cmdline{display:flex;gap:8px;align-items:center;margin:9px 0 0;flex-wrap:wrap}
.fork .cmdline code{font-size:11.5px;word-break:break-all}
.fork .copy{font:inherit;font-size:11.5px;padding:3px 10px;border-radius:2px;
  border:1px solid var(--rule2);background:var(--panel);color:var(--ink2);
  cursor:pointer;white-space:nowrap}
.fork .copy:hover{border-color:var(--accent);color:var(--accent)}
.fork .copy:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fork .fine{margin-top:8px;font-size:11.5px;color:var(--ink3);line-height:1.5}

footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:12px;color:var(--ink3);line-height:1.6}
footer code{font-family:var(--mono);font-size:11.5px}
</style>

<div class="wrap">
<header>
  <h1>Forseti Source Tree</h1>
  <p class="sub">session <code>a280762a</code> · 163 輪 · 節點顏色由「她下一句是什麼」決定，不是由我這一輪說了什麼決定</p>
</header>

<div class="tally" id="tally"></div>

<div class="mini">
  <div class="mini-lbl">全景 · 依時序</div>
  <div class="mini-bar" id="mini"></div>
  <p class="mini-note" id="mininote"></p>
</div>

<div class="cols">
  <div class="listwrap">
    <div class="filters" id="filters"></div>
    <ol class="line" id="list"></ol>
  </div>
  <div class="detail" id="detail"></div>
</div>

<footer>
  判定只用三個結構事實，每一個都指得出 transcript 的哪一行：她下一句是什麼（<code>owner.classify()</code>）、這一輪有沒有驗不過的宣稱（<code>claims.verify()</code>）、她是不是只是叫我繼續（<code>stopreason.classify_stop()</code>）。<br>
  沒有加權、沒有分數、沒有溫度。一個節點的顏色可以用一句話講完它憑什麼是那個顏色，講不出來就不該有顏色。
</footer>
</div>

<script src="nodes.js"></script>
<script>
(function(){
  var LV = ["OK","STALLED","WATCH","CORRECTED"];
  var DESC = {
    OK:"她往下走了，帶著新的東西",
    STALLED:"她只是叫我繼續。那一輪停在不該停的地方",
    WATCH:"她要我澄清。沒有人做錯，但我沒講清楚",
    CORRECTED:"她糾正了我"
  };
  var nodes = window.FORSETI_NODES || [];
  var active = null, filter = null;

  var counts = {};
  LV.forEach(function(l){ counts[l] = 0; });
  nodes.forEach(function(n){ counts[n.lv] = (counts[n.lv]||0) + 1; });

  var tally = document.getElementById("tally");
  LV.forEach(function(l){
    var d = document.createElement("div");
    d.innerHTML = '<div class="num c-'+l+'">'+counts[l]+'</div>'+
      '<div class="lbl">'+l+'</div><div class="desc">'+DESC[l]+'</div>';
    tally.appendChild(d);
  });

  var mini = document.getElementById("mini");
  nodes.forEach(function(n){
    var i = document.createElement("i");
    i.style.background = "var(--"+n.lv.toLowerCase()+")";
    i.title = "第 "+n.n+" 輪 · "+n.lv;
    i.addEventListener("click", function(){ select(n.n); });
    mini.appendChild(i);
  });
  var lastStall = nodes.filter(function(n){ return n.lv === "STALLED"; });
  if (lastStall.length) {
    var tailIdx = lastStall[Math.max(0, lastStall.length-6)].n;
    document.getElementById("mininote").textContent =
      "琥珀色是 STALLED。最後 " + Math.min(6, lastStall.length) +
      " 個從第 " + tailIdx + " 輪起連在一起，那是同一個序列裡她必須逐句開口的地方。";
  }

  var filters = document.getElementById("filters");
  function mkBtn(label, val){
    var b = document.createElement("button");
    b.textContent = label;
    b.setAttribute("aria-pressed", String(filter === val));
    b.addEventListener("click", function(){
      filter = (filter === val) ? null : val;
      render();
    });
    return b;
  }
  function drawFilters(){
    filters.textContent = "";
    filters.appendChild(mkBtn("全部 "+nodes.length, null));
    LV.forEach(function(l){
      if (counts[l]) filters.appendChild(mkBtn(l+" "+counts[l], l));
    });
  }

  var list = document.getElementById("list");
  function render(){
    drawFilters();
    list.textContent = "";
    nodes.forEach(function(n){
      if (filter && n.lv !== filter) return;
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.className = "node";
      b.dataset.lv = n.lv;
      b.dataset.n = n.n;
      b.setAttribute("aria-current", String(active === n.n));
      var rail = '<span class="rail"><span class="dot" style="background:var(--'+
        n.lv.toLowerCase()+')"></span></span>';
      b.innerHTML = '<span class="idx">'+n.n+'</span>'+rail+
        '<span class="txt"></span>';
      b.querySelector(".txt").textContent = n.ow || "(無)";
      b.addEventListener("click", function(){ select(n.n); });
      li.appendChild(b);
      list.appendChild(li);
    });
  }

  var detail = document.getElementById("detail");
  function esc(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

  function select(num){
    active = num;
    var i = nodes.findIndex(function(n){ return n.n === num; });
    if (i < 0) return;
    var n = nodes[i], prev = i > 0 ? nodes[i-1] : null;
    var bad = (n.lv === "STALLED" || n.lv === "CORRECTED");

    var html = '<div class="d-head">'+
      '<span class="d-round">第 '+n.n+' 輪</span>'+
      '<span class="badge b-'+n.lv+'">'+n.lv+'</span>'+
      '<span class="d-meta">'+(n.at || "")+' · owner L'+n.ol+
      (n.al ? ' · ai L'+n.al : '')+(n.tl ? ' · '+n.tl+' 次工具' : '')+'</span></div>';

    html += '<p class="why w-'+n.lv+'">'+esc(n.why)+'</p>';
    html += '<div class="seg owner"><h3>她說</h3><p>'+esc(n.ow)+'</p></div>';
    html += '<div class="seg"><h3>我那一輪</h3><p>'+esc(n.ai || "(這一輪沒有文字輸出)")+'</p></div>';

    if (n.rf && n.rf.length) {
      html += '<div class="seg"><h3>驗不過的宣稱</h3><ul class="refs">';
      n.rf.forEach(function(r){ html += '<li>'+esc(r)+'</li>'; });
      html += '</ul></div>';
    }

    html += '<div class="fork"><h3>從哪裡 fork</h3>';
    if (bad && prev) {
      var cmd = 'python3 tools/fork-session.py a280762a --at-line ' + prev.ol;
      html += '<p>退回第 '+prev.n+' 輪（owner 訊息在 transcript 第 '+prev.ol+
        ' 行），那是這一節變色之前最後一個乾淨的節點。</p>'+
        '<p class="cmdline"><code id="cmd-'+n.n+'">'+esc(cmd)+'</code>'+
        '<button class="copy" data-cmd="'+esc(cmd)+'">複製</button></p>'+
        '<p class="fine">切點之後的紀錄會被丟掉，祖先鏈整條留著，原檔一個位元組都不動。'+
        '跑完會給一個新的 session id，用 <code>claude --resume &lt;新 id&gt;</code> 接下去。</p>';
    } else if (bad) {
      html += '<p>這是第一輪，前面沒有可以退回的節點。</p>';
    } else {
      html += '<p class="na">這一節沒有變色，不需要 fork。</p>';
    }
    html += '</div>';

    detail.innerHTML = html;
    var cp = detail.querySelector(".copy");
    if (cp) cp.addEventListener("click", function(){
      var t = cp.dataset.cmd;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(t).then(function(){
          cp.textContent = "已複製";
          setTimeout(function(){ cp.textContent = "複製"; }, 1400);
        }).catch(function(){ cp.textContent = "複製不了"; });
      } else {
        cp.textContent = "複製不了";
      }
    });
    render();
    var el = list.querySelector('[data-n="'+num+'"]');
    if (el) el.scrollIntoView({block:"nearest"});
  }

  render();
  var firstBad = nodes.find(function(n){ return n.lv === "STALLED"; });
  select(firstBad ? firstBad.n : (nodes[0] && nodes[0].n));
})();
</script>
